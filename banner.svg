<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Raúl Chávez · Desarrollador Full Stack y Analista de Datos">
  <defs>
    <clipPath id="frame"><rect width="1200" height="320" rx="18"/></clipPath>

    <radialGradient id="glowBlue"><stop offset="0" stop-color="#1f6feb" stop-opacity=".55"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowPurple"><stop offset="0" stop-color="#8957e5" stop-opacity=".5"/><stop offset="1" stop-color="#8957e5" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowTeal"><stop offset="0" stop-color="#14b8a6" stop-opacity=".4"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></radialGradient>

    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#8b949e" opacity=".18"/>
    </pattern>

    <linearGradient id="shine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".42" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#9ecbff"/>
      <stop offset=".58" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffffff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1200 0" to="1200 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="lineGrad" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset=".5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="areaGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8957e5" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" x2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".9"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: 'Cascadia Code', Consolas, 'SF Mono', Menlo, 'Courier New', monospace; }

    .orb1 { animation: drift1 14s ease-in-out infinite; }
    .orb2 { animation: drift2 18s ease-in-out infinite; }
    .orb3 { animation: drift3 16s ease-in-out infinite; }
    @keyframes drift1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(180px,40px); } }
    @keyframes drift2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-220px,-30px); } }
    @keyframes drift3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(120px,-50px); } }

    .fadeUp { opacity: 0; animation: fadeUp .9s ease-out forwards; }
    .d1 { animation-delay: .2s; } .d2 { animation-delay: .5s; } .d3 { animation-delay: .9s; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

    .role { opacity: 0; animation: role 12s infinite; }
    .r1 { animation-delay: 1s; } .r2 { animation-delay: 4s; } .r3 { animation-delay: 7s; } .r4 { animation-delay: 10s; }
    @keyframes role {
      0% { opacity: 0; transform: translateY(8px); }
      4%, 21% { opacity: 1; transform: translateY(0); }
      25%, 100% { opacity: 0; transform: translateY(-8px); }
    }

    .cursor { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 6s ease-in-out infinite; }
    .area { opacity: 0; animation: area 6s ease-in-out infinite; }
    @keyframes draw { 0% { stroke-dashoffset: 1; } 45%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -1; } }
    @keyframes area { 0%, 25% { opacity: 0; } 45%, 80% { opacity: 1; } 100% { opacity: 0; } }

    .bar { transform-box: fill-box; transform-origin: bottom; animation: grow 4s ease-in-out infinite; }
    .b1 { animation-delay: 0s; } .b2 { animation-delay: .25s; } .b3 { animation-delay: .5s; }
    .b4 { animation-delay: .75s; } .b5 { animation-delay: 1s; } .b6 { animation-delay: 1.25s; }
    @keyframes grow { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }

    .streak { animation: streak 7s linear infinite; opacity: 0; }
    .s2 { animation-delay: 2.4s; } .s3 { animation-delay: 4.9s; }
    @keyframes streak {
      0% { transform: translate(-300px, -60px); opacity: 0; }
      5% { opacity: 1; }
      25% { transform: translate(1500px, 300px); opacity: 0; }
      100% { transform: translate(1500px, 300px); opacity: 0; }
    }

    .float { animation: float 6s ease-in-out infinite; }
    .f2 { animation-delay: 1.5s; } .f3 { animation-delay: 3s; }
    @keyframes float { 0%,100% { transform: translateY(0); opacity: .35; } 50% { transform: translateY(-10px); opacity: .7; } }

    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
  </style>

  <g clip-path="url(#frame)">
    <!-- Fondo -->
    <rect width="1200" height="320" fill="#0d1117"/>
    <g filter="url(#blur)">
      <circle class="orb1" cx="250" cy="80" r="170" fill="url(#glowBlue)"/>
      <circle class="orb2" cx="950" cy="230" r="190" fill="url(#glowPurple)"/>
      <circle class="orb3" cx="620" cy="300" r="150" fill="url(#glowTeal)"/>
    </g>
    <rect width="1200" height="320" fill="url(#dots)"/>

    <!-- Destellos -->
    <g stroke="url(#streak)" stroke-width="2" stroke-linecap="round">
      <line class="streak" x1="0" y1="40" x2="140" y2="68"/>
      <line class="streak s2" x1="200" y1="0" x2="320" y2="24"/>
      <line class="streak s3" x1="-100" y1="120" x2="20" y2="144"/>
    </g>

    <!-- Gráfica de línea que se dibuja -->
    <path class="area" d="M0 300 L0 282 C80 278 120 262 200 266 S320 288 400 270 S520 236 600 248 S720 270 800 240 S940 210 1000 222 S1120 196 1200 186 L1200 320 L0 320 Z" fill="url(#areaGrad)"/>
    <path class="line" pathLength="1" d="M0 282 C80 278 120 262 200 266 S320 288 400 270 S520 236 600 248 S720 270 800 240 S940 210 1000 222 S1120 196 1200 186" fill="none" stroke="url(#lineGrad)" stroke-width="3" filter="url(#neon)"/>
    <circle r="5" fill="#ffffff" filter="url(#neon)">
      <animateMotion dur="6s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.45;1" calcMode="spline" keySplines=".42 0 .58 1; 0 0 1 1"
        path="M0 282 C80 278 120 262 200 266 S320 288 400 270 S520 236 600 248 S720 270 800 240 S940 210 1000 222 S1120 196 1200 186"/>
    </circle>

    <!-- Barras (a la derecha) -->
    <g transform="translate(880 66)" opacity=".9">
      <rect x="-24" y="-22" width="300" height="164" rx="14" fill="#161b22" fill-opacity=".55" stroke="#30363d"/>
      <circle class="pulse" cx="-6" cy="-6" r="4" fill="#3fb950"/>
      <text class="mono" x="6" y="-2" font-size="11" fill="#8b949e">dashboard.pbix</text>
      <line x1="0" y1="124" x2="252" y2="124" stroke="#30363d"/>
      <rect class="bar b1" x="8"   y="40" width="26" height="84" rx="4" fill="url(#barGrad)"/>
      <rect class="bar b2" x="50"  y="20" width="26" height="104" rx="4" fill="url(#barGrad)"/>
      <rect class="bar b3" x="92"  y="58" width="26" height="66" rx="4" fill="url(#barGrad)"/>
      <rect class="bar b4" x="134" y="10" width="26" height="114" rx="4" fill="url(#barGrad)"/>
      <rect class="bar b5" x="176" y="34" width="26" height="90" rx="4" fill="url(#barGrad)"/>
      <rect class="bar b6" x="218" y="16" width="26" height="108" rx="4" fill="url(#barGrad)"/>
    </g>

    <!-- Símbolos flotando -->
    <g class="mono" font-size="18" fill="#58a6ff">
      <text class="float" x="700" y="70">&lt;/&gt;</text>
      <text class="float f2" x="790" y="150" fill="#bc8cff">{ }</text>
      <text class="float f3" x="640" y="160" fill="#14b8a6" font-size="14">SELECT *</text>
    </g>

    <!-- Texto -->
    <g transform="translate(72 0)">
      <text class="mono fadeUp d1" x="0" y="88" font-size="16" fill="#3fb950">~/raulchvzt <tspan fill="#8b949e">$</tspan> <tspan fill="#c9d1d9">whoami</tspan></text>
      <text class="sans fadeUp d2" x="-3" y="158" font-size="66" font-weight="700" fill="url(#shine)" letter-spacing="-1">Raúl Chávez</text>

      <g class="fadeUp d3">
        <text class="mono" x="0" y="204" font-size="22" fill="#8b949e">&gt;</text>
        <g class="mono" font-size="22" font-weight="600">
          <text class="role r1" x="24" y="204" fill="#58a6ff">Desarrollador Full Stack</text>
          <text class="role r2" x="24" y="204" fill="#bc8cff">Analista de Datos</text>
          <text class="role r3" x="24" y="204" fill="#14b8a6">React · Node.js · SQL · Power BI</text>
          <text class="role r4" x="24" y="204" fill="#f2cc60">Buscando prácticas profesionales</text>
        </g>
        <text class="sans" x="0" y="236" font-size="15" fill="#8b949e">Ingeniería en Sistemas Computacionales · TecNM Colima</text>
      </g>
    </g>

    <rect width="1200" height="320" rx="18" fill="none" stroke="#30363d"/>
  </g>
</svg>
